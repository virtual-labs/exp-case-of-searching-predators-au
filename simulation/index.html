<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Optimal Foraging with Minimal Time (Shrew & Worms) — Simulation</title>
<link rel="stylesheet" href="./css/main.css">
</head>
<body>
<div class="card" id="simbox">
<div class="simbar"><span class="simbar-logo" aria-hidden="true"><img src="images\logo.svg" alt="Amrita Vishwa Vidyapeetham"></span><h1 class="simbar-title">Optimal Foraging with Minimal Time (Shrew &amp; Worms)</h1><button class="fs-btn" id="fsBtn" onclick="toggleFS()" title="Toggle full screen" aria-label="Toggle full screen">⛶</button></div>
<div class="sim">
<div class="controls">
<p style="margin:0 0 12px;color:var(--muted);font-size:.85rem">Average time to find and capture a prey item, versus prey abundance, for a shrew that mixes worms and beetles in different proportions.</p>
<div class="field"><label>Handling time, worm h_w (s) <span class="val" id="v_hw">1</span></label><input type="range" id="hw" min="0.2" max="5" step="0.1" value="1" oninput="sync()"></div>
<div class="field"><label>Handling time, beetle h_b (s) <span class="val" id="v_hb">60</span></label><input type="range" id="hb" min="10" max="120" step="1" value="60" oninput="sync()"></div>
<div class="field"><label>Beetle abundance a_b <span class="val" id="v_ab">0.0025</span></label><input type="range" id="ab" min="0.0005" max="0.02" step="0.0005" value="0.0025" oninput="sync()"></div>
<div class="field"><label>Start worm abundance <span class="val" id="v_start">0.005</span></label><input type="range" id="start" min="0.001" max="0.02" step="0.001" value="0.005" oninput="sync()"></div>
<div class="field"><label>End worm abundance <span class="val" id="v_end">0.09</span></label><input type="range" id="end" min="0.03" max="0.15" step="0.005" value="0.09" oninput="sync()"></div>
<div class="btnrow">
  <button class="btn btn-primary" onclick="run()">▶ Plot</button>
  <button class="btn btn-ghost" onclick="resetSim()">↺ Reset</button>
</div>
<div class="dl-label">Download</div>
<div class="btnrow">
  <button class="btn btn-accent" onclick="downloadPNG('minimal-time.png')">⤓ PNG</button>
  <button class="btn btn-accent" onclick="downloadCSV()">⤓ CSV</button>
</div>
</div>
<div class="plotwrap">
<div class="plot-title">Average time per prey item vs abundance of worms</div>
<canvas class="chart" id="chart" width="720" height="440"></canvas>
<div class="legend" id="legend"></div>
<div class="readout">Cursor: X = <b id="rx">–</b>, Y = <b id="ry">–</b></div>
<div class="counts" id="counts"></div>
</div>
</div>
</div>
<div class="toast" id="toast"></div>
<script src="./js/chart.js"></script>
<script src="./js/common.js"></script>
<script src="./js/main.js"></script>
<script src="../assets/js/iframeResize.js"></script>
        
        </body>
</html>
